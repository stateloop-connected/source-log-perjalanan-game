<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0f18" />
    <!-- Added to the home screen, the game opens fullscreen without browser bars. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Log Hidup" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Log Perjalanan Hidup</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230b0f18'/><rect x='3' y='7' width='2' height='2' fill='%23f2cc60'/><rect x='6' y='7' width='7' height='2' fill='%23c9d1e0'/></svg>"
    />
    <style>
      @font-face {
        font-family: 'Press Start 2P';
        src: url('./fonts/PressStart2P.woff2') format('woff2');
        font-display: block;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        height: 100dvh;
        background: #0b0f18;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      /* Phones held upright: ask to rotate. Desktop windows that are narrow are left alone. */
      #putar {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #0b0f18;
        color: #f2cc60;
        font-family: 'Press Start 2P', monospace;
        font-size: 12px;
        line-height: 2;
        text-align: center;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #putar {
          display: flex;
        }
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="putar">PUTAR HP-MU<br />KE POSISI MENDATAR</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
